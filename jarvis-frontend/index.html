<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme + accent color before first paint, so nothing —
      // including the landing page's canvas, which reads the accent via
      // getComputedStyle — ever flashes the wrong color or renders with a
      // stale one on first mount.
      (function () {
        var saved = localStorage.getItem("jarvis_theme");
        var wantsDark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", wantsDark);
        document.documentElement.classList.toggle("light", !wantsDark);

        // Keep this list in sync with ACCENTS in src/ProfilePanel.jsx
        var ACCENTS = {
          violet: "light-dark(#5B3DF5, #8B7CFF)",
          emerald: "light-dark(#059669, #34D399)",
          rose: "light-dark(#E11D48, #FB7185)",
          sky: "light-dark(#0284C7, #38BDF8)"
        };
        var savedAccent = localStorage.getItem("jarvis_accent") || "violet";
        document.documentElement.style.setProperty("--color-accent", ACCENTS[savedAccent] || ACCENTS.violet);
      })();
    </script>
  </head>
  <body>
    <!-- 3D Particle Background -->
    <div class="particle-container" id="particles"></div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Particle Generator Script -->
    <script>
      (function() {
        const container = document.getElementById('particles');
        if (!container) return;
        
        const colors = ['#5B3DF5', '#8B7CFF', '#22D3EE', '#0EA5E9', '#A78BFA'];
        const count = 40;
        
        for (let i = 0; i < count; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.setProperty('--duration', (12 + Math.random() * 20) + 's');
          particle.style.setProperty('--delay', (Math.random() * 12) + 's');
          particle.style.setProperty('--drift', (Math.random() - 0.5) * 300 + 'px');
          particle.style.left = (Math.random() * 100) + '%';
          const size = 2 + Math.random() * 5;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.background = colors[Math.floor(Math.random() * colors.length)];
          particle.style.opacity = 0.15 + Math.random() * 0.5;
          particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          container.appendChild(particle);
        }
      })();
    </script>
  </body>
</html>
